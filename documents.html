<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documents - Scanify</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Navigation Bar (Desktop) -->
    <nav class="navbar desktop-nav">
        <div class="navbar-container">
            <div class="navbar-logo">
                <i class="fas fa-file-scan"></i>
                <span>Scanify</span>
            </div>
            <ul class="nav-menu">
                <li><a href="index.html">Home</a></li>
                <li><a href="scanner.html">Scanner</a></li>
                <li><a href="documents.html" class="active">Documents</a></li>
                <li><a href="tools.html">Tools</a></li>
                <li><a href="settings.html">Settings</a></li>
            </ul>
            <button class="btn btn-primary nav-scan-btn" onclick="goToScanner()">
                <i class="fas fa-plus"></i> Scan
            </button>
        </div>
    </nav>

    <!-- Bottom Navigation (Mobile) -->
    <nav class="bottom-nav mobile-nav">
        <a href="index.html" class="nav-item" data-page="home">
            <i class="fas fa-home"></i>
            <span>Home</span>
        </a>
        <a href="documents.html" class="nav-item active" data-page="documents">
            <i class="fas fa-file"></i>
            <span>Documents</span>
        </a>
        <button class="nav-fab" onclick="goToScanner()" title="Scan Document">
            <i class="fas fa-plus"></i>
        </button>
        <a href="tools.html" class="nav-item" data-page="tools">
            <i class="fas fa-tools"></i>
            <span>Tools</span>
        </a>
        <a href="settings.html" class="nav-item" data-page="settings">
            <i class="fas fa-cog"></i>
            <span>Settings</span>
        </a>
    </nav>

    <!-- Main Content -->
    <main class="container">
        <div class="documents-container">
            <div class="documents-header">
                <h1>My Documents</h1>
                <div class="search-bar">
                    <i class="fas fa-search"></i>
                    <input type="text" id="searchInput" placeholder="Search documents..." onkeyup="searchDocuments()">
                </div>
            </div>

            <div id="documentsGrid" class="documents-grid">
                <!-- Documents will be loaded here -->
            </div>

            <div id="emptyState" class="empty-state" style="display: none;">
                <i class="fas fa-inbox"></i>
                <p>No documents found.</p>
                <button class="btn btn-primary" onclick="goToScanner()">
                    <i class="fas fa-camera"></i> Start Scanning
                </button>
            </div>

            <div id="noSearchResults" class="empty-state" style="display: none;">
                <i class="fas fa-search"></i>
                <p>No documents match your search.</p>
            </div>
        </div>

        <!-- Document Preview Modal -->
        <div id="previewModal" class="modal" style="display: none;">
            <div class="modal-content modal-large">
                <div class="modal-header">
                    <h2 id="previewTitle">Document Preview</h2>
                    <button class="modal-close" onclick="closePreviewModal()">×</button>
                </div>
                <div class="modal-body">
                    <img id="previewImage" src="" alt="Document Preview" class="preview-image">
                </div>
                <div class="modal-footer">
                    <button class="btn btn-primary" onclick="downloadCurrentDocument()">
                        <i class="fas fa-download"></i> Download
                    </button>
                    <button class="btn btn-secondary" onclick="closePreviewModal()">Close</button>
                </div>
            </div>
        </div>

        <!-- Rename Modal -->
        <div id="renameModal" class="modal" style="display: none;">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Rename Document</h2>
                    <button class="modal-close" onclick="closeRenameModal()">×</button>
                </div>
                <div class="modal-body">
                    <label for="renameName">New Name:</label>
                    <input type="text" id="renameName" class="form-input">
                </div>
                <div class="modal-footer">
                    <button class="btn btn-primary" onclick="confirmRename()">Rename</button>
                    <button class="btn btn-secondary" onclick="closeRenameModal()">Cancel</button>
                </div>
            </div>
        </div>
    </main>

    <!-- Toast Notification -->
    <div id="toast" class="toast"></div>

    <script src="js/app.js"></script>
    <script src="js/documents.js"></script>
</body>
</html>
